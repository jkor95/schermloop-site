<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://api.github.com https://raw.githubusercontent.com; img-src 'self' blob: data:; media-src blob:; style-src 'self'; script-src 'self'; base-uri 'none'; object-src 'none'; form-action 'none'"><title>SchermLoop Beheer</title><link rel="stylesheet" href="styles.css"></head><body data-mode="admin"><header><h1>SchermLoop · Beheer</h1><a href="./">Presentatie</a></header><main><section id="login"><h2>Beveiligde toegang</h2><p class="muted">GitHub controleert de toegang tot alle presentatiebestanden. Gebruik uitsluitend een token dat toegang geeft tot de privé-repository.</p><div class="row"><input id="token" type="password" placeholder="GitHub fine-grained token" autocomplete="off"><button id="connect">Verbinden</button></div></section><section id="workspace" hidden><p id="status" role="status" style="padding:12px;color:#b8d9ff"></p><h2>Presentatie beheren</h2><div class="row"><input id="file" type="file" accept="image/*,video/mp4,video/webm,.pptx"><label>Seconden <input id="duration" type="number" min="2" max="600" value="10" style="width:90px"></label><button id="upload">Toevoegen</button></div><p class="muted">PowerPoint-dia's worden door GitHub Actions verwerkt. Upload maximaal 50 MB per bestand.</p><ol id="items"></ol><button id="save">Volgorde en instellingen opslaan</button><button id="logout">Uitloggen</button></section></main><div id="screen"></div><script src="app.js?v=20261025-io-fix1" defer></script></body></html>
