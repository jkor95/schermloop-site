# SchermLoop 2.0 - aparte Coolify Compose-applicatie uit GitHub.
# Kies in Coolify "Docker Compose" met Base Directory /schermloop-2.0
# en Docker Compose Location /docker-compose.coolify.yml.
# Coolify genereert de databasewachtwoorden, sessiesleutel en beheerderswachtwoord.
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_URL_WEB_3000: /
      PUBLIC_URL: ${SERVICE_URL_WEB_3000}
      NODE_ENV: production
      PORT: "3000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: schermloop
      DB_NAME: schermloop
      DB_PASSWORD: ${SERVICE_PASSWORD_64_SCHERMLOOPDB}
      APP_SECRET: ${SERVICE_PASSWORD_64_SCHERMLOOPSECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Stel het e-mailadres voor je hoofdbeheeraccount in via Coolify}
      ADMIN_PASSWORD: ${SERVICE_PASSWORD_64_SCHERMLOOPADMIN}
      MET_WEATHER_USER_AGENT: ${MET_WEATHER_USER_AGENT:-SchermLoop2.0/0.1 https://jkworks.nl}
      STORAGE_DIR: /app/storage
    volumes:
      - schermloop_files:/app/storage
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 60s
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: schermloop
      POSTGRES_USER: schermloop
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_SCHERMLOOPDB}
    volumes:
      - schermloop_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schermloop -d schermloop"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  schermloop_files:
  schermloop_database:
