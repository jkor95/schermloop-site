services:
  web:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://schermloop:$DB_PASSWORD@db:5432/schermloop
      APP_SECRET: $APP_SECRET
      ADMIN_EMAIL: $ADMIN_EMAIL
      ADMIN_PASSWORD: $ADMIN_PASSWORD
      PUBLIC_URL: $PUBLIC_URL
      NODE_ENV: production
      PORT: "3000"
      STORAGE_DIR: /app/storage
    volumes:
      - uploads:/app/storage
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: schermloop
      POSTGRES_USER: schermloop
      POSTGRES_PASSWORD: $DB_PASSWORD
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schermloop -d schermloop"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  uploads:
  postgres_data:
