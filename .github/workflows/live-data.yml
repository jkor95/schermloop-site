name: Live nieuws en weer verversen
on:
  push:
    paths:
      - 'scripts/update_live.py'
      - '.github/workflows/live-data.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: schermloop-live-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Haal NU.nl en Buienradar op
        run: python3 scripts/update_live.py
      - name: Publiceer nieuwe gegevens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live-data.json
          if ! git diff --cached --quiet; then
            git commit -m "Ververs nieuws en weer"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
