name: SchermLoop 2.0 checks
on:
  push:
    branches: [schermloop-2.0]
    paths:
      - 'schermloop-2.0/**'
      - '.github/workflows/schermloop-2.0.yml'
  pull_request:
    paths:
      - 'schermloop-2.0/**'
jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: schermloop_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d schermloop_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: schermloop-2.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntaxcontrole
        run: |
          node --check server.js
          node --check domain.js
          node --check public/dashboard.js
          node --check public/player.js
          node --check weather.js
          node --check weather-routes.js
          node --check public/weather-view.js
          node --check news.js
          node --check news-routes.js
          node --check public/news-view.js
          node --check public/offline-store.js
          node --check public/service-worker.js
          node --check excel-announcements.js
          node --check excel-routes.js
          node --check legacy-audit.js
          node --check legacy-import-utils.js
          node --check scripts/import-old.js
      - name: Coolify Compose-configuratie valideren
        run: |
          SERVICE_PASSWORD_64_SCHERMLOOPDB=test-database-password-123456789012345678901234567890 \
          SERVICE_PASSWORD_64_SCHERMLOOPSECRET=test-long-secret-123456789012345678901234567890 \
          SERVICE_PASSWORD_64_SCHERMLOOPADMIN=test-admin-password-123456789012345678901234567890 \
          SERVICE_URL_WEB_3000=https://schermloop.example.nl \
          ADMIN_EMAIL=test@example.nl \
          docker compose -f docker-compose.coolify.yml config --quiet
      - name: Dependencies installeren
        run: npm install --omit=dev --no-audit --no-fund
      - name: Domeinregels en integratietests
        run: npm test

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      ADMIN_EMAIL: beheer@example.test
      SERVICE_PASSWORD_64_SCHERMLOOPDB: temporary-ci-database-password-123456789012345678901234567890
      SERVICE_PASSWORD_64_SCHERMLOOPSECRET: temporary-ci-app-secret-123456789012345678901234567890
      SERVICE_PASSWORD_64_SCHERMLOOPADMIN: temporary-ci-admin-password-123456789012345678901234567890
      SERVICE_URL_WEB_3000: https://schermloop.example.test
    steps:
      - uses: actions/checkout@v4
      - name: Docker-image bouwen zonder geheime tokens
        run: docker build --tag schermloop2:ci ./schermloop-2.0
      - name: Node en documentconversie controleren
        run: |
          docker run --rm --entrypoint node schermloop2:ci --version
          docker run --rm --entrypoint libreoffice schermloop2:ci --version
          docker run --rm --entrypoint pdftoppm schermloop2:ci -v 2>&1 | head -n 1
      - name: Start complete tijdelijke Coolify-opstelling
        run: |
          docker compose -f schermloop-2.0/docker-compose.coolify.yml --project-directory schermloop-2.0 -p schermloop2-ci up -d --build --wait --wait-timeout 180
          docker compose -f schermloop-2.0/docker-compose.coolify.yml --project-directory schermloop-2.0 -p schermloop2-ci ps
          docker compose -f schermloop-2.0/docker-compose.coolify.yml --project-directory schermloop-2.0 -p schermloop2-ci exec -T web node -e "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      - name: Back-up maken en integriteit controleren
        run: |
          mkdir -p "$RUNNER_TEMP/schermloop-backups"
          bash schermloop-2.0/scripts/backup-stack.sh "$RUNNER_TEMP/schermloop-backups" schermloop2-ci
          FILE="$(find "$RUNNER_TEMP/schermloop-backups" -name 'schermloop2-*.tar.gz' -print -quit)"
          test -n "$FILE"
          bash schermloop-2.0/scripts/verify-backup.sh "$FILE"
      - name: Herstel back-up naar aparte tijdelijke PostgreSQL-database
        run: |
          FILE="$(find "$RUNNER_TEMP/schermloop-backups" -name 'schermloop2-*.tar.gz' -print -quit)"
          mkdir -p "$RUNNER_TEMP/schermloop-restore"
          tar -xzf "$FILE" -C "$RUNNER_TEMP/schermloop-restore"
          docker compose -f schermloop-2.0/docker-compose.coolify.yml --project-directory schermloop-2.0 -p schermloop2-ci exec -T db createdb -U schermloop schermloop_restore_ci
          docker compose -f schermloop-2.0/docker-compose.coolify.yml --project-directory schermloop-2.0 -p schermloop2-ci exec -T db pg_restore -U schermloop -d schermloop_restore_ci --no-owner --no-acl < "$RUNNER_TEMP/schermloop-restore/database.dump"
          docker compose -f schermloop-2.0/docker-compose.coolify.yml --project-directory schermloop-2.0 -p schermloop2-ci exec -T db psql -U schermloop -d schermloop_restore_ci -tAc "SELECT count(*) FROM users" | grep -E '^[1-9][0-9]*
        if: always()
        run: |
          docker compose -f schermloop-2.0/docker-compose.coolify.yml --project-directory schermloop-2.0 -p schermloop2-ci down -v --remove-orphans


          tar -tzf "$RUNNER_TEMP/schermloop-restore/media.tar.gz" > /dev/null
      - name: Stop en verwijder tijdelijke testdatabase
        if: always()
        run: |
          docker compose -f schermloop-2.0/docker-compose.coolify.yml --project-directory schermloop-2.0 -p schermloop2-ci down -v --remove-orphans

