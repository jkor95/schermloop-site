name: SchermLoop 2.0 checks
on:
  push:
    branches: [schermloop-2.0]
    paths:
      - 'schermloop-2.0/**'
      - '.github/workflows/schermloop-2.0.yml'
  pull_request:
    paths:
      - 'schermloop-2.0/**'
jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: schermloop_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d schermloop_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: schermloop-2.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntaxcontrole
        run: |
          node --check server.js
          node --check domain.js
          node --check public/dashboard.js
          node --check public/player.js
      - name: Dependencies installeren
        run: npm install --omit=dev --no-audit --no-fund
      - name: Domeinregels en integratietests
        run: npm test
